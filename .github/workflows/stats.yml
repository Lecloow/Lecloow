name: Generate GitHub Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create folder
        run: mkdir -p assets

      - name: Generate SVGs
        run: |
          # ===== STATS =====
          curl -f "https://github-readme-stats.vercel.app/api?username=Lecloow&show_icons=true&theme=dark" -o assets/stats-dark.svg || echo "skip"
          curl -f "https://github-readme-stats.vercel.app/api?username=Lecloow&show_icons=true&theme=default" -o assets/stats-light.svg || echo "skip"

          # ===== AFFINITIES =====
          curl -f "https://github-readme-stats.vercel.app/api/pin/?username=Lecloow&repo=Affinities&theme=dark" -o assets/affinities-dark.svg || echo "skip"
          curl -f "https://github-readme-stats.vercel.app/api/pin/?username=Lecloow&repo=Affinities&theme=default" -o assets/affinities-light.svg || echo "skip"

          # ===== PAPILLON =====
          curl -f "https://github-readme-stats.vercel.app/api/pin/?username=PapillonApp&repo=Papillon&theme=dark" -o assets/projet-dark.svg || echo "skip"
          curl -f "https://github-readme-stats.vercel.app/api/pin/?username=PapillonApp&repo=Papillon&theme=default" -o assets/projet-light.svg || echo "skip"

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/*.svg
          git diff --quiet || git commit -m "update cards"
          git push
